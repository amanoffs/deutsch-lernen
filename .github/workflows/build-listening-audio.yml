name: Build bilingual vocabulary audio

on:
  push:
    paths:
      - ".github/workflows/build-listening-audio.yml"
      - "scripts/create_listening_audio.py"
  workflow_dispatch:
    inputs:
      page:
        description: "Vocabulary page number (1–33)"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: bilingual-audio-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOCAB_PAGE: ${{ github.event.inputs.page || '1' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install speech synthesizer and MP3 toolkit
        run: |
          python -m pip install --disable-pip-version-check edge-tts pydub
          ffmpeg -version | head -1

      - name: Produce one MP3 for the selected page
        run: python scripts/create_listening_audio.py --page "$VOCAB_PAGE"

      - name: Publish audio in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "audio-lessons/vocab-page-$(printf '%02d' "$VOCAB_PAGE").mp3"
          if git diff --cached --quiet; then
            echo "Generated audio has no changes."
          else
            git commit -m "audio: German–Azerbaijani vocabulary page $VOCAB_PAGE (single MP3)"
            git push
          fi
